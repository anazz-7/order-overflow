<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="cubeTop" x1="128" y1="120" x2="384" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="cubeLeft" x1="128" y1="240" x2="256" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cubeRight" x1="256" y1="240" x2="384" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <filter id="glow" x="90" y="90" width="332" height="332" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer ambient glow -->
  <circle cx="256" cy="256" r="140" fill="#4F46E5" opacity="0.25" filter="url(#glow)" />

  <!-- Isometric Package Box (Order / Wholesale Goods) -->
  <g transform="translate(0, 10)">
    <!-- Top Face -->
    <path d="M256 128 L384 198 L256 268 L128 198 Z" fill="url(#cubeTop)" stroke="#A5B4FC" stroke-width="3" stroke-linejoin="round" />
    <!-- Left Face -->
    <path d="M128 198 L256 268 L256 392 L128 322 Z" fill="url(#cubeLeft)" stroke="#60A5FA" stroke-width="2" stroke-linejoin="round" />
    <!-- Right Face -->
    <path d="M256 268 L384 198 L384 322 L256 392 Z" fill="url(#cubeRight)" stroke="#818CF8" stroke-width="2" stroke-linejoin="round" />

    <!-- Center Flow Arrow / Dynamic Bolt -->
    <path d="M256 180 L286 230 L264 230 L274 286 L232 242 L252 242 Z" fill="#10B981" />
    <circle cx="256" cy="268" r="10" fill="#34D399" opacity="0.9" />
  </g>
</svg>
